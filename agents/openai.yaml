interface:
  display_name: "牛来粗制 CGI 转译器"
  short_description: "把图像重制成圆滑基础体人物、低模背景与错误绑定的廉价 CGI"
  default_prompt: "Use $niu-lai-translator to rebuild this image like a one-year animation student's badly produced bootleg CGI assignment. Preserve minimal semantic anchors, coarse continuous anatomy, simplified garments, half-lidded vacant eyes, failed gestures, bad skin weights and local penetrations. For animals, reduce mesh detail only moderately but flatten muscle design: remove shoulder blades, chest/abdominal groups, haunch muscles, tendons and athletic limb taper; use a simple barrel/ellipsoid torso and more uniform limbs with broad flat shoulder/hip transitions. Fake fur exclusively through a clearly visible but shallow cheap low-resolution bump/normal channel on flat solid-color diffuse; never create fibers, fuzz, displacement or silhouette change. Clothing and non-fur surfaces stay bump-free. Material-only references never change content. Avoid muscular anatomy, puppet construction, polish, clay, voxels and real fur systems."
